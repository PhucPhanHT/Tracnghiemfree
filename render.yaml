services:
  - type: web
    name: tracnghiemfree
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracnghiemfree-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.18.0

databases:
  - name: tracnghiemfree-db
    plan: free
